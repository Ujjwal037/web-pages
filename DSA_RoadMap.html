aside{position:sticky;top:0;height:100vh;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:10}

.side-tools{display:flex;gap:8px;padding:12px;border-bottom:1px solid var(--line)}.icon{width:38px;height:38px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--text);cursor:pointer}
.home{flex:1;text-align:left;padding:0 12px;width:auto;font-weight:700}
.nav{overflow:auto;padding:10px}.tab{width:100%;border:0;background:transparent;color:var(--text);display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:8px;text-align:left;padding:9px 10px;border-radius:10px;cursor:pointer;margin:2px 0}
.tab:hover,.tab.active{background:var(--soft);color:var(--brand)}.tab .n{width:27px;height:27px;display:grid;place-items:center;border-radius:8px;background:var(--panel2);font-size:11px;font-weight:800}.tab small{color:var(--muted);font-size:10px}

.page{max-width:1180px;margin:auto;padding:42px 46px}

const patterns = [

    "Enumerate every valid candidate and check it. Brute force is the first correct baseline, a test oracle for tiny inputs, and the source of most optimizations.",

    "Loops → count operations → all pairs → incremental subarrays → simulation → subset masks.",

    "Fixed window size → Dynamic expansion (longest valid) → Dynamic contraction (minimum covering) → Monotonic deque window.",
    "Avoids O(N*K) brute-force scanning by maintaining an incremental running state. Both endpoints move forward monotonically, guaranteeing an amortized O(N) time complexity. Character counts are tracked via primitive frequency arrays to avoid map lookup overhead.",
    [
        ["Fixed size", "for right=0 .. n-1:\n  add a[right]\n  if right>=k-1:\n    update answer\n    remove a[right-k+1]"],
        ["Longest valid", "left=0\nfor right=0 .. n-1:\n  add right\n  while invalid:\n    remove left; left++\n  maximize right-left+1"],

    ],

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const KEY = "dsaPatternProgressv4";
const solved = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
let current = "home", filter = "All";

function save() { localStorage.setItem(KEY, JSON.stringify([...solved])); updateOverall(); }

function updateOverall() {
    const total = patterns.reduce((n, p) => n + p.problems.length, 0);
    $("#overallText").textContent = `${solved.size} / ${total} solved`;
    $("#overallBar").style.width = `${(solved.size / total) * 100}%`;
    document.querySelectorAll(".tab").forEach((b) => {
        if(b.dataset.go === "home") return;
        const p = patterns[b.dataset.go]; 
        if(p) b.querySelector("small").textContent = `${p.problems.filter(x => solved.has(x.id)).length}/${p.problems.length}`;
    });
}

function renderNav() {
    $("#nav").innerHTML = patterns.map(p => `<button class="tab" data-go="${p.number}"><span class="n">${p.number}</span><span>${esc(p.title)}</span><small>0/25</small></button>`).join("");
    updateOverall();
}

function Landing() {
    current = "home"; location.hash = "home"; filter = "All";
    $("#page").innerHTML = `
    <section class="hero"><div class="eyebrow">Pattern-first · Java 17/21</div><h1>Learn the patterns.<br>Stop memorizing answers.</h1>
    <p>A guided path from brute force to dynamic programming, with scenario pseudocode and deep architectural Java insights.</p>
    <div class="hero-stats"><div><b>16</b><span>essential patterns</span></div><div><b>400</b><span>curated problems</span></div><div><b>25</b><span>per pattern</span></div><div><b>24-32</b><span>weeks</span></div></div></section>
    <h2>What DSA is—and what interviews actually test</h2><p class="lead">Data structures organize data; algorithms search and transform it. Product-company interviews repeatedly test a finite family of reusable patterns. Your job is to recognize the search space, state brute force, find repeated work, choose the matching structure, and communicate correctness and complexity.</p>
    <div class="grid">
    <div class="card"><h3>Why brute force comes first</h3><p>It proves understanding, gives a correct baseline, and reveals the bottleneck. Never hide it—state it, cost it, then improve it.</p></div>
    <div class="card"><h3>The interview loop</h3><p>Clarify → example → brute force → bottleneck → optimized pattern → code → dry run → time and extra space.</p></div>
    <div class="card"><h3>What mastery means</h3><p>Recognize a pattern, write its scenario templates, solve 14/25 listed problems, then pass two unseen mediums in 40 minutes.</p></div>
    </div>
    <h2>How to study every tab</h2>
    <div class="step"><b>1</b><div>Read the brief, recognition signals, and theoretical internals.</div></div>
    <div class="step"><b>2</b><div>Trace every scenario on tiny input.</div></div>
    <div class="step"><b>3</b><div>Type the pseudocode as Java blind.</div></div>
    <div class="step"><b>4</b><div>Problems 1-10: learn; hints allowed.</div></div>
    <div class="step"><b>5</b><div>Problems 11-20: 40-minute limit.</div></div>
    <div class="step"><b>6</b><div>Problems 21-25: mixed and timed under interview conditions.</div></div>
    <h2>Spaced repetition</h2><div class="card"><p><b>Day 1:</b> learn + 2 easy &nbsp; <b>Day 2:</b> 2 problems &nbsp; <b>Day 4:</b> 2 problems &nbsp; <b>Day 7:</b> 3 &nbsp; <b>Day 14:</b> 3 &nbsp; <b>Day 30:</b> redo two failures without notes.</p><p>Keep an error log: recognition, invariant, off-by-one/null, Java API, overflow, complexity, implementation, or missing edge test.</p></div>
    <h2>Ordered learning path</h2><div class="path">${patterns.map(p => `<button data-go="${p.number}"><span>Pattern ${p.number}</span><strong>${esc(p.title)}</strong></button>`).join("")}</div>
    <h2>Java rules that prevent common failures</h2>
    <div class="grid">
    <div class="card"><h3>Numeric safety</h3><p>Use <code>long</code> for large sums; midpoint is <code>lo+(hi-lo)/2</code>; comparator uses <code>Integer.compare</code> to prevent overflow bugs.</p></div>
    <div class="card"><h3>Collections</h3><p>Use <code>ArrayDeque</code>, not legacy <code>Stack</code>. Hash keys must be immutable and stable. PriorityQueue iteration is inherently not sorted.</p></div>
    <div class="card"><h3>Recursion</h3><p>Java has no tail-call optimization. Copy backtracking state objects (like Lists) and expect deep recursion to trigger StackOverflowError.</p></div>
    </div>
    <div class="footer">This is the job interview core. Segment trees, max flow, suffix automata, and advanced geometry are intentionally excluded.</div>`;
    activateNav(); window.scrollTo(0, 0);
}

function patternPage(index) {
    const p = patterns[index]; current = String(index); location.hash = `pattern-${index}`; filter = "All";
    if(!p) return Landing();
    $("#page").innerHTML = `
    <div class="pattern-head"><div class="pattern-num">${p.number}</div><div><div class="order">Pattern ${p.number} OF 15</div><h1>${esc(p.title)}</h1></div></div>
    <div class="meta"><span class="pill">25 must-solve</span><span class="pill">Java 17/21</span><span class="pill">Beginner → advanced</span></div>
    <div class="brief">
        <p><b>What it is:</b> ${esc(p.brief)}</p>
        <p><b>Recognition signals:</b> ${esc(p.recognize)}</p>
        <p><b>Study order:</b> ${esc(p.study)}</p>
    </div>
    <h2>Theory & Core Mechanics</h2>
    <div class="callout" style="border-color: var(--brand); background: var(--soft);"><b>Java Internal Mechanics:</b> ${esc(p.theory)}</div>
    <h2>Scenario templates</h2><div class="scenario-grid">${p.scenarios.map(s => `<article class="scenario"><h3>${esc(s[0])}</h3><pre>${esc(s[1])}</pre></article>`).join("")}</div>
    <div class="callout"><b>Java pitfalls:</b> ${esc(p.pitfalls)}</div>
    <h2>Must-solve problems</h2><div class="pattern-progress"><span id="patternText"></span><div class="bar"><i id="patternBar"></i></div></div>
    <div class="problem-tools"><input id="search" placeholder="Search number or title..."><div class="filters">${["All", "Easy", "Medium", "Hard"].map(x => `<button data-filter="${x}" class="${x==="All"?"active":""}">${x}</button>`).join("")}</div></div>
    <div class="problems" id="problems"></div>
    <div class="exit"><b>You may move on when:</b> ${esc(p.exit)} Also solve at least 18/25 and two unseen medium problems.</div>
    <div class="footer">Open a problem in LeetCode, write brute force first, then optimize. Check the box only after you can explain the solution without notes.</div>`;
    renderProblems(p, ""); activateNav(); window.scrollTo(0, 0);
    $("#search").addEventListener("input", e => renderProblems(p, e.target.value));
    document.querySelectorAll("[data-filter]").forEach(b => b.onclick = () => { filter = b.dataset.filter; document.querySelectorAll("[data-filter]").forEach(x => x.classList.toggle("active", x===b)); renderProblems(p, $("#search").value); });
}

function renderProblems(p, query) {
    const q = query.trim().toLowerCase();
    const list = p.problems.filter(x => (filter === "All" || x.difficulty === filter) && (!q || x.id.includes(q) || x.name.toLowerCase().includes(q)));
    $("#problems").innerHTML = list.length ? list.map(x => `<label class="problem"><input type="checkbox" data-id="${x.id}" ${solved.has(x.id) ? "checked" : ""}> <span class="id">#${x.id}</span> <a href="https://leetcode.com/problems/${x.slug}/" target="_blank" rel="noopener">${esc(x.name)}</a> <span class="difficulty ${x.difficulty}">${x.difficulty}</span></label>`).join("") : `<div class="empty">No matching problems.</div>`;
    document.querySelectorAll(".problem input").forEach(c => c.onchange = () => { if(c.checked) solved.add(c.dataset.id); else solved.delete(c.dataset.id); save(); updatePatternProgress(p); });
    updatePatternProgress(p);
}

function updatePatternProgress(p) {
    const done = p.problems.filter(x => solved.has(x.id)).length;
    $("#patternText").textContent = `${done} of ${p.problems.length} completed`;
    $("#patternBar").style.width = `${(done / p.problems.length) * 100}%`;
}

function activateNav() { document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", current === b.dataset.go)); }
function go(value) { $("#sidebar").classList.remove("open"); value === "home" ? Landing() : patternPage(Number(value)); }

document.addEventListener("click", e => { const b = e.target.closest("[data-go]"); if(b) go(b.dataset.go); });
$("#menu").onclick = () => $("#sidebar").classList.toggle("open");
$("#theme").onclick = () => { const d = document.documentElement.dataset.theme = document.documentElement.dataset.theme === "dark" ? "light" : "dark"; localStorage.setItem("dsaTheme", d); };
document.documentElement.dataset.theme = localStorage.getItem("dsaTheme") || "light";

renderNav();
const hash = location.hash.match(/pattern-(\d+)/); 
hash && patterns[hash[1]] ? patternPage(hash[1]) : Landing();
</script>
</body>
